name: Build Maya APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'maya-v18-runtime.js'
      - 'maya-features/**'
      - 'index.html'
      - 'maya-main-icon.webp.b64'
      - 'icon-192.png'
      - 'icon-512.png'
      - 'setup-native.sh'
      - 'sw.js'
      - 'vendor/**'
      - 'maya.vrm'
      - 'package.json'
      - 'tests/**'
      - 'native-screenshot/**'
      - 'native-life/**'
      - 'native-app-launcher/**'
      - 'scripts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare the new Maya app icon (PWA)
        run: |
          python3 -m pip install --user Pillow
          python3 scripts/maya-icon.py web
          test -s icon-192.png
          test -s icon-512.png

      - name: Collect web files and integrate Maya V18 modules
        run: |
          set -euo pipefail
          test -s index.html
          test -s setup-native.sh
          test -s maya-v18-runtime.js
          test -s maya-features/memory-v2.js
          test -s maya-features/productivity.js
          test -s maya-features/daily-briefing.js
          test -s maya-features/feature-registry.js
          test -s maya-features/android-bridge.js
          test -s maya-features/agent-suite.js
          test -s maya-features/advanced-loader.js
          test -s maya-features/life-suite.js
          test -s maya-features/life-voice.js
          test -s maya-features/smart-hub.js
          test -s maya-features/app-launcher.js
          test -s native-app-launcher/MayaAppCatalog.java
          test -s native-app-launcher/MayaBackgroundLaunch.java
          test -s native-app-launcher/maya_launch_notify.xml
          test -s scripts/install-app-launcher.py
          test -s tests/app-launcher.test.mjs
          test -s tests/app-launcher-native-check.py
          test -s tests/smart-hub.test.mjs
          test -s tests/life-voice.test.mjs
          test -s native-life/MayaShareInbox.java
          test -s native-life/MayaHomeWidget.java
          test -s native-life/MayaQuickTile.java
          test -s native-life/maya_home_widget.xml
          test -s native-life/maya_widget_info.xml
          test -s scripts/install-life-native.py
          test -s tests/life-native-check.py
          test -s tests/life-suite.test.mjs
          test -s maya-features/private-vault.js
          test -s maya-features/screenshot.js
          test -s maya-features/voice-screenshot.js
          test -s native-screenshot/MayaScreenshot.java
          test -s native-screenshot/MayaCaptureService.java
          test -s scripts/install-screenshot.py
          test -s scripts/ensure-launcher-query.py
          test -s tests/voice-screenshot.test.cjs
          test -s tests/native-screenshot-check.py
          test -s tests/private-vault.test.mjs
          test -s maya-features/offline-commands.js
          test -s maya-features/advanced-panel.html
          node --input-type=module --check < maya-v18-runtime.js
          python3 - <<'PY_ADVANCED_TEST'
          from pathlib import Path
          import re
          s=Path('maya-features/advanced-panel.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">([\s\S]+?)</script>',s)
          if not m: raise SystemExit('Advanced panel module is missing')
          Path('/tmp/maya-advanced-panel.mjs').write_text(m.group(1),encoding='utf-8')
          PY_ADVANCED_TEST
          node --input-type=module --check < /tmp/maya-advanced-panel.mjs
          node tests/private-vault.test.mjs
          node tests/life-suite.test.mjs
          node tests/life-voice.test.mjs
          node tests/smart-hub.test.mjs
          test -s maya-features/agent-voice.js
          test -s maya-features/agent-voice-bridge.js
          node tests/agent-voice.test.mjs
          node tests/agent-suite.test.mjs
          node tests/app-launcher.test.mjs
          python3 tests/app-launcher-native-check.py
          python3 tests/life-native-check.py
          node tests/voice-screenshot.test.cjs
          python3 tests/native-screenshot-check.py
          for js in maya-features/*.js; do node --input-type=module --check < "$js"; done
          grep -Fq "import './agent-suite.js'" maya-features/advanced-loader.js
          mkdir -p www
          cp index.html manifest.webmanifest sw.js icon-192.png icon-512.png www/
          cp -r vendor www/
          if [ -f maya.vrm ]; then cp maya.vrm www/; fi
          # Integrate existing new modules into the ACTUAL APK assets.
          cp -r maya-features www/
          cp maya-v18-runtime.js www/
          python3 - <<'PY_V18'
          from pathlib import Path
          import re
          html = Path('www/index.html')
          s = html.read_text(encoding='utf-8')
          marker = '<script type="module" src="./maya-v18-runtime.js"></script>'
          if marker not in s:
              if '</body>' not in s: raise SystemExit('Cannot find </body> in original Maya index.html')
              s = s.replace('</body>', marker+'\n</body>', 1)
          html.write_text(s, encoding='utf-8')
          sw = Path('www/sw.js')
          w = sw.read_text(encoding='utf-8')
          w = re.sub(r"const V = '[^']+';", "const V = 'maya-v30-agent-voice-20261024';", w, count=1)
          if "'./maya-v18-runtime.js'" not in w:
              if 'const SHELL = [' not in w: raise SystemExit('Unexpected sw.js shell declaration')
              w = w.replace('const SHELL = [', "const SHELL = ['./maya-v18-runtime.js', './maya-features/feature-registry.js', './maya-features/android-bridge.js', './maya-features/memory-v2.js', './maya-features/productivity.js', './maya-features/daily-briefing.js', './maya-features/advanced-loader.js', './maya-features/agent-suite.js', './maya-features/agent-voice.js', './maya-features/agent-voice-bridge.js', './maya-features/offline-commands.js', './maya-features/advanced-panel.html', './maya-features/private-vault.js', './maya-features/screenshot.js', './maya-features/voice-screenshot.js', './maya-features/life-suite.js', './maya-features/life-voice.js', './maya-features/smart-hub.js', './maya-features/app-launcher.js', ",1)
          sw.write_text(w, encoding='utf-8')
          print('Maya V18 integrated in www/ without editing original repository index.html or setup-native.sh')
          PY_V18
          grep -Fq 'maya-v18-runtime.js' www/index.html
          test -s www/maya-features/memory-v2.js
          test -s www/maya-features/agent-voice.js
          test -s www/maya-features/agent-voice-bridge.js
          test -s www/maya-features/agent-suite.js
          test -s www/maya-features/productivity.js
          test -s www/maya-features/daily-briefing.js

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Load private signing key (optional, for seamless updates)
        env:
          MAYA_SIGNING_KEY_B64: ${{ secrets.MAYA_SIGNING_KEY_B64 }}
        run: |
          if [ -n "$MAYA_SIGNING_KEY_B64" ]; then
            printf '%s' "$MAYA_SIGNING_KEY_B64" | base64 --decode > maya-debug.keystore
            test -s maya-debug.keystore
            echo "Existing private signing key loaded."
          else
            echo "No signing secret configured. A new debug key will be used; it may not update a previous installation."
          fi

      - name: Add Maya native features
        run: |
          if [ -f setup-native.sh ]; then bash setup-native.sh; fi

      - name: Install consent-based screenshot and launcher visibility
        run: |
          set -euo pipefail
          python3 scripts/ensure-launcher-query.py
          python3 scripts/install-screenshot.py
          python3 scripts/install-life-native.py
          python3 scripts/install-app-launcher.py
          grep -Fq 'public String listLaunchableApps()' android/app/src/main/java/com/tanim/maya/MayaBridge.java
          grep -Fq 'public String launchListedApp(' android/app/src/main/java/com/tanim/maya/MayaBridge.java
          test -s android/app/src/main/java/com/tanim/maya/MayaAppCatalog.java
          grep -Fq 'public String takeSharedText()' android/app/src/main/java/com/tanim/maya/MayaBridge.java
          grep -Fq 'MayaHomeWidget' android/app/src/main/AndroidManifest.xml
          grep -Fq 'MayaQuickTile' android/app/src/main/AndroidManifest.xml
          grep -Fq 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          grep -Fq 'registerPlugin(MayaScreenshot.class);' android/app/src/main/java/com/tanim/maya/MainActivity.java
          grep -Fq 'FOREGROUND_SERVICE_MEDIA_PROJECTION' android/app/src/main/AndroidManifest.xml

      - name: Add permissions (microphone, camera)
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Replace Android launcher icon with new Maya artwork
        run: |
          python3 scripts/maya-icon.py android
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish matching PWA icons to GitHub Pages source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Maya launcher and PWA icons'
            git push
          fi

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Maya-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish a download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Maya.apk
          gh release create "v${{ github.run_number }}" Maya.apk \
            --title "Maya v${{ github.run_number }}" \
            --notes "Maya V30: Voice-controlled eight-feature Agent Suite in Settings (planning, browser links, Android app launcher, file analysis, grounded research, read-only multi-step tasks, coding review, local dashboard). Requires the user's own Gemini key/quota. Previous 3D, voice, memory and native features preserved. Android device test still needed."